version: '3.8'

include:
  - path:
    env_file:
      - ./.env

services:
  # obsidian:
  #   image: 'ghcr.io/sytone/obsidian-remote:latest'
  #   container_name: obsidian
  #   volumes:
  #     - ../vaults:/docs/vaults:rw
  #     - ../config/obsidian:/config/obsidian:rw
  #     # - type: volume
  #     #   source: repo-volume
  #     #   target: '/vaults'
